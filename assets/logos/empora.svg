<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Empora for WooCommerce">
  <defs>
    <linearGradient id="empora-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="92" height="92" rx="22" fill="url(#empora-grad)"/>
  <!-- Stylized "E" stack of modules: three rounded bars = many modules, one product -->
  <rect x="28" y="26" width="40" height="9" rx="4.5" fill="#FFFFFF"/>
  <rect x="28" y="43.5" width="30" height="9" rx="4.5" fill="#FFFFFF" opacity="0.92"/>
  <rect x="28" y="61" width="40" height="9" rx="4.5" fill="#FFFFFF" opacity="0.84"/>
  <!-- Commerce cart dot anchoring the lower bar -->
  <circle cx="68" cy="65.5" r="5" fill="#10B981"/>
</svg>
