  <circle cx="56" cy="13.5" r="2.6" fill="#ffffff" opacity="0.85"/>
  <circle cx="63.5" cy="13" r="2.0" fill="#ffffff" opacity="0.55"/>
  <circle cx="70" cy="14" r="1.5" fill="#ffffff" opacity="0.32"/>
  <circle cx="75.5" cy="16" r="1.0" fill="#ffffff" opacity="0.18"/>
  <!-- chat bubble -->
  <path d="M30 36 h36 a6 6 0 0 1 6 6 v16 a6 6 0 0 1 -6 6 H46 l-10 9 v-9 h-6 a6 6 0 0 1 -6 -6 V42 a6 6 0 0 1 6 -6 z" fill="#ffffff"/>
  <!-- keyhole = E2E encryption -->
  <circle cx="48" cy="48" r="5.4" fill="#7c3aed"/>
  <path d="M45.6 51.4 h4.8 l1.4 7 h-7.6 z" fill="#7c3aed"/>
