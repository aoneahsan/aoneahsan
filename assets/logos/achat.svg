<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Anonymous Chat AI (AChat)">
  <defs>
    <radialGradient id="achatai-mesh" cx="68%" cy="28%" r="90%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="42%" stop-color="#7c3aed"/>
      <stop offset="78%" stop-color="#5b21b6"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </radialGradient>
  </defs>
  <rect x="2" y="2" width="92" height="92" rx="22" fill="url(#achatai-mesh)"/>
  <!-- 10-day ring with a top gap that dissolves into a comet of fading dots -->
